# The experiment registry.
#
# One entry per experiment that produced a number quoted anywhere. An entry is
# written before the run, not after, so the analysis is fixed while the answer
# is unknown. `fold` says which data the experiment is entitled to read, and
# anything reading TEST needs a matching unseal in audit.log.
#
# status: registered | running | complete | superseded
# fold:   train | val | test

version: 1

experiments:
  - id: baseline-reconciliation
    status: complete
    fold: train
    question: >
      Four independent estimates of the classic policy spanned 44 to 61 shots.
      One board generator, one tie-break rule, one seed pool, re-measured.
    metric: mean shots to clear
    design: 20000 games per policy on one seeded uniform pool, common random numbers
    result:
      random: "95.354 [95.288, 95.421]"
      parity-hunt-target: "51.535 [51.414, 51.656]"
      density: "44.369 [44.246, 44.491]"
    notes: >
      Also the source of sigma = 8.87 and the bimodal correlation, 0.923 within
      the density family and 0.00 against the hunt policy.

  - id: objective-comparison
    status: complete
    fold: train
    question: Does information-greedy play underperform hit-greedy play?
    metric: expected shots against the exact optimum
    design: exact solution on small instances, every objective priced against it
    result: >
      max-hit-probability within 0.16 shots of optimal and exactly optimal on 3
      of 6 instances; max-information-gain loses up to 6.86 shots.
    notes: exploratory on TRAIN; the TEST version is pre-registered and unrun.

  - id: bound-ladder
    status: complete
    fold: none
    question: How tight is the certified lower bound on the optimum?
    metric: shots
    design: exact combinatorics, no sampling
    result: "coverage 17, water filling 24.088, best measured policy 44.369"
    notes: >
      No fold applies: these are exact counts rather than estimates. The
      max-coverage rung was investigated and withdrawn; see docs/MAXCOVER.txt.

  - id: opponent-model-value
    status: complete
    fold: none
    question: Is modelling the opponent's placement bias worth anything?
    metric: expected shots, exact over enumerated boards
    design: every board enumerated and weighted; only the learning is sampled
    result: >
      oracle gain 1.14 shots at theta = 3 on 5x5 {4,3,2}; learnable in about ten
      games if the shape is known, several hundred if not; believing a bias that
      is absent costs 0.51 shots; a mild permanent assumption has the better
      worst case.
    notes: see docs/OPPONENT.txt.

  - id: headline-policy-comparison
    status: complete
    fold: test
    question: >
      Does the density policy beat parity hunt/target on mean shots, and does
      max-information-gain underperform max-hit-probability, on sealed data?
    metric: mean shots to clear; 95th percentile; paired difference
    design: >
      Sample size from experiments/preregistration.md, chosen per comparison
      from the measured correlation. Fixed before the run; no extension and no
      early stop.
    result:
      games: 20000
      random: "95.339 [95.271, 95.406]"
      parity-hunt-target: "51.564 [51.444, 51.684]"
      density-b10: "44.443 [44.320, 44.567]"
      density-b50: "44.407 [44.283, 44.530]"
      density-b200: "44.407 [44.283, 44.530]"
      p95: "random 100, parity 64, density 61"
      paired-parity-minus-density: "+7.121 [+6.947, +7.294]"
      correlation: "0.916 inside the density family, -0.015 across families"
    notes: >
      Run once at the pre-registered size, no extension and no early stop. Every
      TEST mean falls inside the TRAIN interval for the same policy, so the
      TRAIN figures were not overfitted: random 95.339 against 95.354, parity
      51.564 against 51.535, density 44.443 against 44.369.

      The bimodal correlation reproduced: 0.916 within the density family against
      0.923 on TRAIN, and effectively zero across families. The pre-registered
      sample size was derived from exactly that structure.

      The harness self-test also held on unseen data: the random shooter measured
      95.3387 against a theoretical k(N+1)/(k+1) of 95.3889.

      Beam width stops mattering past 50. density(b=50) and density(b=200) agree
      to every digit with a paired difference of exactly 0.000 and correlation
      1.000, so the larger beam is pure cost.

      See experiments/headline_test.json for the full capture.
