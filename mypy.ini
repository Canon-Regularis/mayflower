# The Python layer's type gate.
#
# The C++ has a type system the build enforces, and -Werror has caught real
# defects here three times. The Python layer is 9,000 lines that compute every
# published interval and render both deliverables, and until this file the only
# static check on it was tests/test_python_names.py.
#
# mypy.ini rather than pyproject.toml. pyproject announces an installable
# project to pip, build backends and editors, and this repository deliberately
# has no packaging: the documented entry points are path-run scripts and the
# import mechanism is sys.path.insert. This file is single-purpose and cannot
# be mistaken for packaging metadata.

[mypy]
# Pinned, not left to the host. The development machine runs 3.14, and typeshed
# is conditional on both the version and the platform, so an unpinned checker
# checks a different standard library from the one the gate checks. The two
# agree exactly today; that is luck, not a property of anything.
#
# 3.12 is what the gate runs on. mypy is installed in one job, reference-models,
# which sets up Python 3.12 like every other setup-python leg. The MSYS2 leg is
# the exception and always was: it installs mingw-w64-ucrt-x86_64-python
# unpinned and has no mypy, so it skips the type gate rather than running it
# against a different standard library.
python_version = 3.12
platform = linux

strict = True
warn_unused_configs = True

# python/, tools/ and tests/ are three flat roots reached by sys.path.insert,
# not packages. This is what makes `from _harness import ...` resolve, and it
# is why no __init__.py is needed or wanted.
#
# Never add an __init__.py to any of the three. mypy derives a module's name by
# crawling up while __init__.py exists, so one would turn build_report into
# tools.build_report, and every sibling import in the tree would stop
# resolving. The same goes for explicit_package_bases, which re-bases on the
# repository root and breaks the tree in the same way.
mypy_path = python, tools, tests

# There is no per-module section, and there should never be one again.
#
# Landing this took a shrinking exemption list: every unannotated module
# relaxed the three annotation flags and nothing else, and modules left the
# list bottom-up, because disallow_untyped_calls is evaluated on the caller and
# a module cannot leave until everything it calls has. The list is empty, so
# the section is gone. Adding one back exempts a module from the only static
# check the Python layer has.
