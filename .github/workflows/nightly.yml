name: Nightly

on:
  schedule:
    # 03:00 UTC. Nothing here gates a merge, so it runs when the queue is quiet.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A long run must never be cancelled by the next night's, and two must never
# overlap on the same cache.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMAKE_ARGS: -DMF_NATIVE=OFF
  WERROR: -Werror -Wno-error=stringop-overread -Wno-error=array-bounds

  # The build that every job sharing one ccache key configures, named once
  # rather than typed per job. The key was written out four times across the two
  # workflows as the literal ubuntu-24.04-g++-13-Release, which is what the build
  # matrix's own key template computes for its first leg two hundred lines away.
  # Move the matrix to another runner or compiler and those four jobs, three of
  # them with budgets between 180 and 300 minutes, stop hitting the cache the
  # matrix leg fills, with nothing anywhere to say so.
  #
  # runs-on cannot read the env context, so CACHE_OS is still spelled out there.
  # tests/test_stated_counts.py checks that repetition, checks the two workflows
  # agree, and checks that no job has gone back to a literal key.
  CACHE_OS: ubuntu-24.04
  CACHE_CXX: g++-13
  CACHE_BUILD_TYPE: Release

# ccache-action is the only action here published by anyone other than GitHub.
# It is pinned to a commit rather than a tag, with the release that commit
# carried in the trailing comment, because a tag is a mutable pointer: v1 can be
# moved onto a different commit by whoever owns it, and a pinned digest cannot.
# ci.yml pins setup-msys2 on the same argument, and records there that the
# actions are not the whole third-party surface.
#
# actions/* stays on its major tag deliberately. The same argument applies less
# forcefully there, since GitHub publishes them and a pin costs the automatic
# security patching that moving tag is for, which is the trade this project has
# already taken by letting Dependabot bump those majors.

jobs:
  extended:
    name: extended suite
    runs-on: ubuntu-24.04
    # -L pr is fifteen tests, twelve at TIMEOUT 900 and three at 1800, so ctest
    # itself may spend 270 minutes before giving up. The budget is above that
    # rather than under it; see ci.yml's copy of this comment for why, and
    # tests/test_stated_counts.py for what now derives it.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes, fetches or calls the API, so the token has no
          # use after the clone. Left in .git/config it is readable by every
          # step that follows, which in most of these jobs includes a
          # third-party action and in one of them a package fetched from PyPI.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2.20
        with:
          key: ${{ env.CACHE_OS }}-${{ env.CACHE_CXX }}-${{ env.CACHE_BUILD_TYPE }}

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CACHE_BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER=${{ env.CACHE_CXX }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build

      - name: Extended tests
        run: ctest --test-dir build -L pr --output-on-failure --no-tests=error

  uniformity:
    name: uniformity at scale
    runs-on: ubuntu-24.04
    # The nightly label selects three tests: test_uniformity, live_exact
    # and exact_heavy, each carrying TIMEOUT 3600. ctest runs them
    # serially, so the worst case is 10,800 s, which is 180 minutes before
    # checkout, ccache restore or build. At 180 the budget was exactly the
    # worst case and the job would have been killed mid-test rather than
    # reporting one. 210 leaves half an hour around it.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes, fetches or calls the API, so the token has no
          # use after the clone. Left in .git/config it is readable by every
          # step that follows, which in most of these jobs includes a
          # third-party action and in one of them a package fetched from PyPI.
          persist-credentials: false

      # live_exact drives node through Python. This job had neither, and
      # worked only because the runner image happens to ship both: CMake
      # would otherwise not register the test at all, and nothing would say
      # so.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2.20
        with:
          key: ${{ env.CACHE_OS }}-${{ env.CACHE_CXX }}-${{ env.CACHE_BUILD_TYPE }}

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CACHE_BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER=${{ env.CACHE_CXX }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build

      # 300,000 draws against the exact marginals. A biased board generator would
      # poison every measured statistic in the project without being visible
      # anywhere else, which is why this is checked at scale as well as proved by
      # the exhaustive unrank test.
      - name: The nightly label
        run: ctest --test-dir build -L nightly --output-on-failure --no-tests=error

  report-pipeline:
    name: report pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here pushes, fetches or calls the API, so the token has no
          # use after the clone. Left in .git/config it is readable by every
          # step that follows, which in most of these jobs includes a
          # third-party action and in one of them a package fetched from PyPI.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2.20
        with:
          key: ${{ env.CACHE_OS }}-${{ env.CACHE_CXX }}-${{ env.CACHE_BUILD_TYPE }}

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CACHE_BUILD_TYPE }} \
            -DCMAKE_CXX_COMPILER=${{ env.CACHE_CXX }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build

      # The game count matches what the README documents, because
      # collect_results cross-checks tool output against the captured tables in
      # docs/ and a different count would move the measured rows.
      - name: Generate the figure data
        run: |
          mkdir -p out
          ./build/report_data 20000 > out/figures.json

      # ctest reports Skipped, and exits zero, when out/figures.json is absent.
      # That is right for the per-push suite and wrong here, where running the
      # figure-data tests for real is the whole point of the job.
      - name: The figure data is there to check
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("out/figures.json", encoding="utf-8"))
          missing = [k for k in ("meta", "prior", "collapse", "bounds") if k not in d]
          if missing:
              sys.exit("figures.json is missing {}".format(missing))
          print("figures.json carries", len(d), "sections")
          EOF

      # Above the gate, not below it, and this is load bearing.
      #
      # figure_marks reads this page and can only skip without it. Three of
      # provenance's checks read it too and simply vanish without it, leaving
      # that test to report "all checks passed" over two key-presence tests on
      # a dict. With the render below the gate the first made the job red and
      # the second went unnoticed, and since the gate then exits 1 the render
      # never ran at all: no CI path produced this page.
      #
      # Moving this back below the gate restores both faults at once.
      - name: Render the report
        run: python tools/render_report.py out/figures.json out/report.html

      # scrubber_js is gated on out/figures.json like the other two, and was
      # left out of this list. Being labelled fast, it therefore ran nowhere:
      # every push leg skipped it for want of out/, and the one job that
      # builds out/ did not call it.
      #
      # provenance arrived later and landed in exactly the same hole, which
      # is the argument for this list being the one place a figure-data
      # test is named. Six now, with pool.
      #
      # pool was the last one outside this list, and it was the worst placed.
      # It reads web/pool.bin, which is tracked, so it passed on every push
      # while the one check in it that says the pool is correctly distributed
      # sat behind a test for out/figures.json and silently did not run. Being
      # outside this list, it ran nowhere else either.
      #
      # Do not write the count into prose elsewhere: docs/CI.md named three
      # here for two rounds after this list reached five. The list is the
      # fact and everything else is derived from it.
      #
      # A skip still exits zero, which is how scrubber_js stayed missing without
      # anything going red, so a skip is an error in the one job that supplies
      # what they are gated on.
      - name: The figure-data contract
        run: |
          ctest --test-dir build -R '^(report_data|results|scrubber_js|provenance|figure_marks|pool)$' \
            -V --no-tests=error > out/figure-data.log 2>&1 \
            || { cat out/figure-data.log; exit 1; }
          cat out/figure-data.log
          if grep -q Skipped out/figure-data.log; then
            echo 'a figure-data test skipped in the job that exists to run it'
            exit 1
          fi
          # And the quieter failure. ctest prints Skipped, so the rule above
          # can see a test that did not run; nothing prints anything when a
          # test runs, drops half its checks and reports success. The tests
          # that can do that say so in this phrase.
          #
          # This is why the run above is -V and not --output-on-failure: the
          # phrase is printed by a test that PASSES, and ctest keeps a passing
          # test's output to itself unless asked for all of it. The verbose log
          # runs to a couple of hundred lines for this list, which is a
          # count deliberately not written down: the line above it corrected
          # one such number and this one stayed stale in the same step.
          if grep -q 'CHECKS OMITTED' out/figure-data.log; then
            echo 'a figure-data test passed with checks left out; see the line above'
            exit 1
          fi

      # The rest of the label, in the one job where its inputs exist.
      #
      # ci.yml proves twenty-one tests are registered, on its two per-push build
      # legs, and the step above proves six of them ran. Nothing proved the rest
      # of the fast label ran anywhere. Thirteen fast tests are SKIPPABLE; six
      # are the figure-data list above, and the other seven were in no protected
      # list at all: platform, static_types, selfplay_fold, run_headline,
      # render_results, tool_cli and live_js. Being registered says nothing about
      # having run, and a skip exits zero, so any of those could have skipped on
      # every runner and reported green every time. CMakeLists.txt says of
      # platform that every number in docs/BENCHMARKS.md assumes the pin took.
      #
      # So rather than adding seven more names to a list, this asserts the
      # complement: which tests are allowed to skip here, and why each one is.
      # Anything else that skips is a test that has quietly stopped running, and
      # tests/test_stated_counts.py derives both sides of that from the
      # registrations rather than trusting this comment.
      #
      # One caveat worth keeping, because it is a finding rather than a
      # correction: run_headline carries SKIPPABLE and has no code path that
      # returns 77, so it could not have skipped. The flag claims a behaviour
      # the test does not have.
      - name: The rest of the fast label, with the skips accounted for
        run: |
          ctest --test-dir build -L fast --output-on-failure --no-tests=error \
            > out/fast.log 2>&1 || { cat out/fast.log; exit 1; }
          tail -30 out/fast.log
          python - <<'EOF'
          import io, re, sys

          # platform: the thread pinning it checks is implemented for Windows
          #   only, and this runner is Linux, so the test says so and returns 77.
          #   The MSYS2 UCRT64 leg in ci.yml is where it runs for real.
          # static_types: mypy is the one dependency outside the standard
          #   library. The reference-models job installs it and treats a skip
          #   there as a failure, which is the hard gate; it is not installed
          #   here and this job is not the place to make it one.
          allowed = {"platform", "static_types"}

          log = io.open("out/fast.log", encoding="utf-8", errors="replace").read()
          skipped = set(re.findall(r"^\s*\d+ - (\S+) \(Skipped\)", log, re.M))
          print("skipped here:", ", ".join(sorted(skipped)) or "nothing")

          stray = sorted(skipped - allowed)
          if stray:
              sys.exit("these skipped in the job that supplies what they are "
                       "gated on: {}".format(stray))

          # The positive control, and the reason this step can fail rather than
          # only report. Everything above reads one thing: ctest's trailing
          # "did not run" block. If that block moves, is reworded, or stops
          # being printed, `skipped` is empty, `stray` is empty, and the step
          # passes having asserted nothing about any of the seven tests it
          # exists to protect. Both names in `allowed` skip here by
          # construction, so their absence means the parse changed and not that
          # the suite improved.
          missing = sorted(allowed - skipped)
          if missing:
              sys.exit("expected to skip here and did not, so this step is "
                       "no longer reading ctest's summary rather than the "
                       "suite having improved: {}".format(missing))
          EOF

      # The captured transcripts, against the tools that print them.
      #
      # docs/*.txt feeds 43 of the dossier's 118 rows and had no link back to
      # the engine. tests/test_provenance.py names them in RESULT_SOURCES, but
      # only as mtime inputs deciding whether experiments/results.json is
      # stale, so they were checked as sources of the record and never as
      # artefacts of the tools. On a fresh clone every mtime is checkout time,
      # so an mtime rule could not have covered it here either.
      #
      # The gate is the collected values, not the bytes. docs/M9_RESULTS.txt
      # carries a "DP mean us" column in its constraint-density table, so it
      # is not byte-reproducible: regenerating it on a loaded machine moves
      # every figure in that column and the "DP cost peaks at N hits" line
      # under it. None of that is published. collect_results reads three
      # tables from that file and the density table is not one of them, which
      # was confirmed by parsing both copies: 29 rows out, zero different.
      #
      # So the transcripts are regenerated over the checkout and the record is
      # recollected. --check compares every collected value against the
      # committed experiments/results.json, so a transcript whose published
      # numbers moved fails here and one whose timings moved does not. The
      # byte diff is printed either way, because a change outside the parsed
      # tables is worth seeing even when it cannot move a row.
      #
      # build/weighted is excluded: section 3 of its output reports its own
      # wall-clock seconds, and it is the one transcript no published row
      # reads at all.
      - name: The captured transcripts still match their tools
        run: |
          mkdir -p out/transcripts
          for tool in m9 maxcover opponent; do
            ./build/$tool > out/transcripts/$tool.txt
          done
          cp docs/M9_RESULTS.txt docs/MAXCOVER.txt docs/OPPONENT.txt out/transcripts/
          for pair in "m9:M9_RESULTS" "maxcover:MAXCOVER" "opponent:OPPONENT"; do
            tool=${pair%%:*}; doc=${pair##*:}
            if diff -u "docs/$doc.txt" "out/transcripts/$tool.txt"                  > "out/transcripts/$tool.diff"; then
              echo "docs/$doc.txt is byte identical to build/$tool"
            else
              echo "docs/$doc.txt differs from build/$tool:"
              head -30 "out/transcripts/$tool.diff"
            fi
            cp "out/transcripts/$tool.txt" "docs/$doc.txt"
          done

      # The gate. Every row the regenerated transcripts produce, against the
      # committed record, which is what a reader of the dossier is shown.
      - name: And the values they publish are the recorded ones
        run: |
          python tools/collect_results.py --check || {
            echo 'a published number moved. The step above regenerated the'
            echo 'three transcripts and the job regenerated out/figures.json,'
            echo 'so the drift is in one of those rather than in the record;'
            echo 'the lines above name which rows.'
            exit 1
          }
          git checkout -- docs/

      # The renderer concatenates strings and cannot fail on a page that came out
      # empty, so the page is checked for the things it is supposed to contain.
      - name: The report is a report
        run: |
          python - <<'EOF'
          import base64, io, re, sys
          html = io.open("out/report.html", encoding="utf-8").read()
          size = len(html.encode("utf-8"))
          figures = html.count("<svg")
          if size < 500_000:
              sys.exit("report.html is {} bytes, far under the expected size".format(size))
          if figures < 10:
              sys.exit("report.html carries {} inline figures".format(figures))
          if "15,046,987,768" not in html:
              sys.exit("report.html does not carry the hypothesis-space size")

          # Guarded from above as well. Four fifths of this page is one
          # attribute, the base64 board pool, and the only bound on the page was
          # a floor: a pool regenerated at twice the size would have doubled the
          # file with nothing to say so. The budget in the plan is 0.7 to 1.0 MB
          # and the pool already puts it past that, so the ceiling is set where
          # a materially larger pool trips it rather than where the plan sits.
          if size > 2_500_000:
              sys.exit("report.html is {} bytes; check what grew, the pool is "
                       "usually most of it".format(size))

          # The pool as it ships, not as it sits on disk. tests/test_pool.py
          # checks web/pool.bin; nothing checked that the bytes reaching the
          # page are those bytes, so a bad encode would have shipped a widget
          # that silently falls back to its degraded regime.
          m = re.search(r'data-pool="([^"]+)"', html)
          if m is None:
              sys.exit("report.html carries no board pool for the live widget")
          embedded = base64.b64decode(m.group(1))
          on_disk = io.open("web/pool.bin", "rb").read()
          if embedded != on_disk:
              sys.exit("the embedded pool is {} bytes against {} on disk".format(
                  len(embedded), len(on_disk)))
          print("report.html: {:.0f} KB, {} inline figures, pool {} boards".format(
              size / 1024, figures, len(embedded) // 5))
          EOF

      # The deliverable, made public.
      #
      # README calls out/report.html the deliverable, and until this existed the
      # only way to see it was a twelve minute report_data run after a full
      # toolchain install, or a fourteen day artifact behind a GitHub login.
      #
      # report.html becomes index.html because it IS the front page: the site is
      # the two rendered artefacts and nothing hand-written, so there is no
      # third page to keep in step with them. This runs after the assertions
      # above, so a page that failed its own size, figure-count and pool-identity
      # checks is never published.
      - name: Assemble the site
        run: |
          python tools/render_results.py
          mkdir -p out/site
          cp out/report.html  out/site/index.html
          cp out/results.html out/site/results.html
          ls -l out/site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

      # Keep the output whether or not the checks passed, so a failure can be
      # inspected rather than only described.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            out/report.html
            out/results.html
            out/figures.json
            out/figure-data.log
            out/fast.log
          retention-days: 14
          if-no-files-found: ignore

  # Publishing is a separate job so the write scope it needs is confined to it.
  # The workflow default is contents: read and the other three jobs keep it;
  # only this one can write Pages, and it builds nothing and runs no test.
  #
  # It needs all three, not just the job that built the page. report-pipeline
  # proves the page renders and that its own figure-data tests pass; it does not
  # run the sampler at 300,000 draws or the heavy solver cross-check. With
  # `needs: report-pipeline` alone, a night where uniformity found the board
  # generator biased would have gone red on the badge and refreshed the public
  # page from that same run. A reader following the badge to the page would then
  # be reading numbers the run had just failed to stand behind.
  #
  # The ref guard matters because workflow_dispatch takes one. Without it,
  # anyone who can dispatch this workflow can publish any branch's report to the
  # public site.
  pages:
    name: publish the report
    needs: [extended, uniformity, report-pipeline]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Not 10. actions/deploy-pages polls for its own deployment with a ten
    # minute timeout of its own, so a budget of ten means a slow night is
    # cancelled by GitHub at the same moment the action would have reported what
    # went wrong, leaving a red job with no diagnostic. This is the fault the
    # uniformity job above records finding on itself: a budget set exactly at
    # the worst case reports nothing when it is reached.
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # This job needs one thing a workflow cannot do for itself: the repository's
    # Pages source has to be set to GitHub Actions, under Settings then Pages.
    # Until it is, the deploy below fails with a 404, because a repository with
    # Pages disabled has no deployments endpoint to post to.
    #
    # actions/configure-pages does have an `enablement` input that would turn it
    # on, and it was tried here and removed: its own action.yml says that input
    # needs a token carrying administration:write, which the job token cannot be
    # given. A step that claims to enable Pages and cannot is worse than no step,
    # because the failure would arrive one action further from its cause.
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
