name: Nightly

on:
  schedule:
    # 03:00 UTC. Nothing here gates a merge, so it runs when the queue is quiet.
    - cron: '0 3 * * *'
  workflow_dispatch:

# A long run must never be cancelled by the next night's, and two must never
# overlap on the same cache.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMAKE_ARGS: -DMF_NATIVE=OFF
  WERROR: -Werror -Wno-error=stringop-overread -Wno-error=array-bounds

jobs:
  extended:
    name: extended suite
    runs-on: ubuntu-24.04
    # -L pr is fourteen tests, twelve at TIMEOUT 900 and two at 1800, so ctest
    # itself may spend 240 minutes before giving up.
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-g++-13-Release

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build

      - name: Extended tests
        run: ctest --test-dir build -L pr --output-on-failure --no-tests=error

  uniformity:
    name: uniformity at scale
    runs-on: ubuntu-24.04
    # test_uniformity carries TIMEOUT 3600 on its own.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-g++-13-Release

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build --target test_uniformity

      # 300,000 draws against the exact marginals. A biased board generator would
      # poison every measured statistic in the project without being visible
      # anywhere else, which is why this is checked at scale as well as proved by
      # the exhaustive unrank test.
      - name: Uniformity
        run: ctest --test-dir build -L nightly --output-on-failure --no-tests=error

  report-pipeline:
    name: report pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-g++-13-Release

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="$WERROR" \
            $CMAKE_ARGS
          cmake --build build

      # The game count matches what the README documents, because
      # collect_results cross-checks tool output against the captured tables in
      # docs/ and a different count would move the measured rows.
      - name: Generate the figure data
        run: |
          mkdir -p out
          ./build/report_data 20000 > out/figures.json

      # ctest reports Skipped, and exits zero, when out/figures.json is absent.
      # That is right for the per-push suite and wrong here, where running these
      # three for real is the whole point of the job.
      - name: The figure data is there to check
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("out/figures.json", encoding="utf-8"))
          missing = [k for k in ("meta", "prior", "collapse", "bounds") if k not in d]
          if missing:
              sys.exit("figures.json is missing {}".format(missing))
          print("figures.json carries", len(d), "sections")
          EOF

      # scrubber_js is gated on out/figures.json like the other two, and was
      # left out of this list. Being labelled fast, it therefore ran nowhere:
      # every push leg skipped it for want of out/, and the one job that
      # builds out/ did not call it.
      # A skip still exits zero, which is how scrubber_js stayed missing without
      # anything going red, so a skip is an error in the one job that supplies
      # what these three are gated on.
      - name: The figure-data contract
        run: |
          ctest --test-dir build -R '^(report_data|results|scrubber_js)$' \n            --output-on-failure --no-tests=error > figure-data.log 2>&1 \n            || { cat figure-data.log; exit 1; }
          cat figure-data.log
          if grep -q Skipped figure-data.log; then
            echo 'a figure-data test skipped in the job that exists to run it'
            exit 1
          fi

      - name: Render the report
        run: python tools/render_report.py out/figures.json out/report.html

      # The renderer concatenates strings and cannot fail on a page that came out
      # empty, so the page is checked for the things it is supposed to contain.
      - name: The report is a report
        run: |
          python - <<'EOF'
          import base64, io, re, sys
          html = io.open("out/report.html", encoding="utf-8").read()
          size = len(html.encode("utf-8"))
          figures = html.count("<svg")
          if size < 500_000:
              sys.exit("report.html is {} bytes, far under the expected size".format(size))
          if figures < 10:
              sys.exit("report.html carries {} inline figures".format(figures))
          if "15,046,987,768" not in html:
              sys.exit("report.html does not carry the hypothesis-space size")

          # Guarded from above as well. Four fifths of this page is one
          # attribute, the base64 board pool, and the only bound on the page was
          # a floor: a pool regenerated at twice the size would have doubled the
          # file with nothing to say so. The budget in the plan is 0.7 to 1.0 MB
          # and the pool already puts it past that, so the ceiling is set where
          # a materially larger pool trips it rather than where the plan sits.
          if size > 2_500_000:
              sys.exit("report.html is {} bytes; check what grew, the pool is "
                       "usually most of it".format(size))

          # The pool as it ships, not as it sits on disk. tests/test_pool.py
          # checks web/pool.bin; nothing checked that the bytes reaching the
          # page are those bytes, so a bad encode would have shipped a widget
          # that silently falls back to its degraded regime.
          m = re.search(r'data-pool="([^"]+)"', html)
          if m is None:
              sys.exit("report.html carries no board pool for the live widget")
          embedded = base64.b64decode(m.group(1))
          on_disk = io.open("web/pool.bin", "rb").read()
          if embedded != on_disk:
              sys.exit("the embedded pool is {} bytes against {} on disk".format(
                  len(embedded), len(on_disk)))
          print("report.html: {:.0f} KB, {} inline figures, pool {} boards".format(
              size / 1024, figures, len(embedded) // 5))
          EOF

      # Keep the output whether or not the checks passed, so a failure can be
      # inspected rather than only described.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            out/report.html
            out/figures.json
          retention-days: 14
          if-no-files-found: ignore
